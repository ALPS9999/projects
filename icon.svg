<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF922B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Book shape -->
  <g transform="translate(256,220)">
    <rect x="-120" y="-100" width="240" height="180" rx="20" fill="rgba(255,255,255,0.15)"/>
    <line x1="0" y1="-100" x2="0" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
    <!-- Text lines -->
    <rect x="-100" y="-70" width="80" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
    <rect x="-100" y="-42" width="70" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
    <rect x="-100" y="-14" width="90" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
    <rect x="20" y="-70" width="80" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
    <rect x="20" y="-42" width="60" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
    <rect x="20" y="-14" width="85" height="12" rx="6" fill="rgba(255,255,255,0.3)"/>
  </g>
  <!-- "字" character -->
  <text x="256" y="410" font-family="PingFang SC,Noto Sans SC,sans-serif" font-size="80" font-weight="900" fill="white" text-anchor="middle" opacity="0.9">识字小达人</text>
</svg>
